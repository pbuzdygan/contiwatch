services:
  contiwatch:
    image: ghcr.io/pbuzdygan/contiwatch:latest
    container_name: contiwatch
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - contiwatch_data:/data
    environment:
      # Default internal port can be changed - helpful when running in "network_mode: host" or other "direct IP" setups
      CONTIWATCH_ADDR: ":8080"
      CONTIWATCH_CONFIG: "/data/config.json"
      # Optional timezone for scheduler/log timestamps
      TZ: Europe/Warsaw
      # Required in controller mode: app PIN (4-8 digits)
      APP_PIN: "1234"
      # Optional: PIN session lifetime in seconds (default 28800 = 8h)
      # CONTIWATCH_PIN_SESSION_TTL_SEC: "28800"
      # Optional: minimum response time for PIN verify (default 250ms)
      # CONTIWATCH_PIN_MIN_RESPONSE_MS: "250"
    restart: unless-stopped

volumes:
  contiwatch_data:
